spring:
  application:
    name: agentprobe

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/agentprobe}
    username: ${SPRING_DATASOURCE_USERNAME:agentprobe}
    password: ${SPRING_DATASOURCE_PASSWORD:agentprobe}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: 6379

  ai:
    ollama:
      base-url: ${SPRING_AI_OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: llama3.2:latest
          temperature: 0.0
      embedding:
        options:
          model: nomic-embed-text

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never

agentprobe:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-32-bytes-min!!}
    access-token-minutes: 15
    refresh-token-days: 7

  crypto:
    key: ${ENCRYPTION_KEY:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}

  security:
    allow-private-targets: ${ALLOW_PRIVATE_TARGETS:true}

  judge:
    timeout-seconds: 120

  runs:
    max-concurrent-runs: 2
    queue-size: 20
    global-concurrency: 6
    scenario-timeout-seconds: 300
    retry-backoff-ms: 1000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method