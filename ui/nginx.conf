server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Only the API and Swagger are exposed. /actuator is never reachable from outside.
  location /api/ {
    proxy_pass http://agentprobe:8081;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 300s;
    proxy_buffering off;
  }

  location /swagger-ui { proxy_pass http://agentprobe:8081; }
  location /v3/api-docs { proxy_pass http://agentprobe:8081; }
  location /actuator/ { return 404; }

  location / {
    try_files $uri /index.html;
  }
}